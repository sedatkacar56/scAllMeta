<!doctype html>
<html lang="en" data-theme="aurora">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
/* ---------- themes ---------- */
:root, :root[data-theme="aurora"] {
  --bgimg: radial-gradient(1100px 620px at 85% -10%, #4b1d8f 0%, transparent 60%),
           radial-gradient(900px 560px at -10% 105%, #0a6f8c 0%, transparent 55%),
           linear-gradient(160deg, #080b1c, #0d1230);
  --side: rgba(14, 19, 46, .78); --panel: rgba(255,255,255,.07); --panel-solid: #141a3a;
  --text: #f4f7ff; --muted: #b3bddc; --line: rgba(255,255,255,.16);
  --accent: #22d3ee; --soft: rgba(34,211,238,.16); --input: rgba(255,255,255,.09);
  --g1: #22d3ee; --g2: #a78bfa; --g3: #f472b6; --na: #7e89ad;
  --hdr: #1b2350; --hdrtext: #ffffff; --first: #141a3a; --warn: #fbbf24; --tot: #1d2656;
  --title: linear-gradient(90deg, #22d3ee, #a78bfa 55%, #f472b6);
  --blur: blur(14px);
}
:root[data-theme="light"] {
  --bgimg: linear-gradient(#f3f5fb, #f3f5fb);
  --side: #ffffff; --panel: #ffffff; --panel-solid: #ffffff;
  --text: #0b1220; --muted: #45526b; --line: #c9d2e3;
  --accent: #1f4fd8; --soft: #e3ebff; --input: #f3f5fb;
  --g1: #2f6fed; --g2: #2f6fed; --g3: #1b3fa8; --na: #9aa6bd;
  --hdr: #e8eefc; --hdrtext: #0b1220; --first: #ffffff; --warn: #b45309; --tot: #e8eefc;
  --title: linear-gradient(#0b1220, #0b1220);
  --blur: none;
}
:root[data-theme="classic"] {
  --bgimg: linear-gradient(#ffffff, #ffffff);
  --side: #ffffff; --panel: #ffffff; --panel-solid: #ffffff;
  --text: #000000; --muted: #333333; --line: #000000;
  --accent: #d00000; --soft: #fff3a8; --input: #ffffff;
  --g1: #4aa3ff; --g2: #4aa3ff; --g3: #4aa3ff; --na: #999999;
  --hdr: #3cb043; --hdrtext: #000000; --first: #ffff66; --warn: #8a4b00; --tot: #f08080;
  --title: linear-gradient(#000, #000);
  --blur: none;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); background: var(--bgimg) fixed; }
.app { display: grid; grid-template-columns: 310px 1fr; height: 100vh; }
aside { background: var(--side); backdrop-filter: var(--blur); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
aside header { padding: 20px 18px 10px; }
aside h1 { font-size: 19px; margin: 0 0 3px; overflow-wrap: anywhere; background: var(--title); -webkit-background-clip: text; background-clip: text; color: transparent; }
:root[data-theme="light"] aside h1, :root[data-theme="classic"] aside h1 { color: var(--text); background: none; }
aside .sub { color: var(--muted); font-size: 13px; }
input[type=search] { width: 100%; margin-top: 12px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--input); color: var(--text); font: inherit; }
input[type=search]::placeholder { color: var(--muted); opacity: .85; }
input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#cols { overflow: auto; flex: 1; padding: 6px 10px 18px; }
.col { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 8px 12px; border: 0; border-radius: 10px; background: none; color: var(--text); font: inherit; cursor: pointer; }
.col:hover { background: var(--soft); }
.col.active { background: var(--soft); box-shadow: inset 4px 0 0 var(--accent); font-weight: 600; }
.col .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.col .ct { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.tag { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--muted); color: var(--muted); }
.tag.num { color: var(--warn); border-color: var(--warn); }

main { overflow: auto; padding: 0 34px 56px; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; margin-bottom: 8px; background: var(--bgimg); background-attachment: fixed; backdrop-filter: var(--blur); }
.crumb { color: var(--muted); font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--input); }
.seg button { border: 0; background: none; color: var(--text); font: inherit; font-size: 13.5px; padding: 7px 13px; cursor: pointer; }
.seg button:hover { background: var(--soft); }
.seg button.on { background: var(--accent); color: #fff; font-weight: 600; }
:root[data-theme="aurora"] .seg button.on { color: #04121a; }
.lbl { color: var(--muted); font-size: 12.5px; margin-right: 6px; }

h2 { margin: 6px 0 4px; font-size: 28px; line-height: 1.2; overflow-wrap: anywhere; background: var(--title); -webkit-background-clip: text; background-clip: text; color: transparent; }
:root[data-theme="light"] h2, :root[data-theme="classic"] h2 { color: var(--text); background: none; }
.lead { color: var(--muted); margin-bottom: 22px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 24px; }
.tile { background: var(--panel); backdrop-filter: var(--blur); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.tile .k { color: var(--muted); font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; }
.tile .v { font-size: 25px; font-weight: 700; font-variant-numeric: tabular-nums; background: var(--title); -webkit-background-clip: text; background-clip: text; color: transparent; }
:root[data-theme="light"] .tile .v, :root[data-theme="classic"] .tile .v { color: var(--text); background: none; }
.card { background: var(--panel); backdrop-filter: var(--blur); border: 1px solid var(--line); border-radius: 14px; padding: 6px 0 12px; }
.tools { display: flex; gap: 10px; align-items: center; padding: 12px 16px; flex-wrap: wrap; }
.tools input[type=search] { margin: 0; max-width: 290px; }
button.btn { padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--input); color: var(--text); font: inherit; cursor: pointer; }
button.btn:hover { border-color: var(--accent); }
button.btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
:root[data-theme="aurora"] button.btn.on { color: #04121a; font-weight: 600; }

table { width: 100%; border-collapse: collapse; }
th, td { padding: 9px 16px; text-align: left; border-top: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
td.lv { max-width: 440px; overflow-wrap: anywhere; }
tr.na td.lv { color: var(--muted); font-style: italic; }
.barcell { width: 34%; min-width: 130px; }
.bar { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--g1), var(--g2), var(--g3)); box-shadow: 0 0 12px rgba(167,139,250,.25); }
:root[data-theme="light"] .bar { box-shadow: none; }
tr.na .bar { background: var(--na); box-shadow: none; }
tbody tr.link { cursor: pointer; }
tbody tr.link:hover { background: var(--soft); }
.note { color: var(--muted); font-size: 13px; padding: 8px 16px 0; }
.note b { color: var(--text); }
svg.hist { width: 100%; height: 220px; display: block; }
.empty { padding: 26px; color: var(--muted); }

/* comparison table */
.xwrap { overflow: auto; max-height: 68vh; margin-top: 6px; }
table.x th, table.x td { white-space: nowrap; }
table.x thead th { position: sticky; top: 0; background: var(--hdr); color: var(--hdrtext); z-index: 2; text-align: right; text-transform: none; font-size: 13.5px; letter-spacing: 0; }
table.x thead th:first-child, table.x tbody td:first-child { position: sticky; left: 0; background: var(--first); z-index: 1; text-align: left; font-weight: 600; }
table.x thead th:first-child { z-index: 3; background: var(--hdr); }
table.x td.c { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
table.x td.c small { display: block; font-size: 11.5px; font-weight: 500; opacity: .85; }
table.x tr.tot td { background: var(--tot); font-weight: 700; border-top: 2px solid var(--line); }
table.x tr.tot td:first-child { background: var(--tot); }
table.x td.tc, table.x th.tc { border-left: 2px solid var(--line); }
.legend { display: flex; align-items: center; gap: 10px; padding: 4px 16px 0; color: var(--muted); font-size: 12.5px; }
.legend .ramp { width: 220px; height: 11px; border-radius: 6px; border: 1px solid var(--line); }
.cmp { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 0 0 18px; }
.cmp input { margin: 0; max-width: 360px; }
.hint { color: var(--muted); font-size: 13px; }

/* classic (gt look) */
:root[data-theme="classic"] table th, :root[data-theme="classic"] table.x thead th { background: #3cb043; color: #000; font-weight: 700; border: 1px solid #000; }
:root[data-theme="classic"] td { border: 1px solid #000; }
:root[data-theme="classic"] td.lv { background: #ffff66; font-weight: 700; }
:root[data-theme="classic"] td.cn { background: #add8e6; font-weight: 700; }
:root[data-theme="classic"] td.cp { background: #ffd580; font-weight: 700; }
:root[data-theme="classic"] table.x td.c.flat { background: #add8e6; }
:root[data-theme="classic"] table.x td.c.pc { background: #ffd580; }
:root[data-theme="classic"] table.x tr.tot td { background: #f08080; border: 1px solid #000; }
:root[data-theme="classic"] .card, :root[data-theme="classic"] .tile { border: 2px solid #000; border-radius: 4px; }
:root[data-theme="classic"] .seg button.on, :root[data-theme="classic"] button.btn.on { background: #d00000; color: #fff; }
:root[data-theme="classic"] aside { background: #fff; }
@media (max-width: 760px) { .app { grid-template-columns: 1fr; height: auto; } aside { max-height: 40vh; } main { padding: 0 16px 40px; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1>__TITLE__</h1>
      <div class="sub" id="sub"></div>
      <input type="search" id="q" placeholder="Search columns..." autocomplete="off">
    </header>
    <div id="cols"></div>
  </aside>
  <main id="main">
    <div class="topbar">
      <span class="crumb" id="crumb"></span>
      <span><span class="lbl">Layout</span><span class="seg" id="themeseg"></span></span>
    </div>
    <div id="view"></div>
  </main>
</div>
<script>
const DATA = __DATA__;
const fmt = n => n == null ? "-" : Number(n).toLocaleString();
const pct = (n, tot) => tot ? (100 * n / tot) : 0;
const pfmt = p => p >= 10 ? p.toFixed(1) + "%" : p >= 0.01 ? p.toFixed(2) + "%" : p > 0 ? "<0.01%" : "0%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const main = document.getElementById("main");
const view = document.getElementById("view");
const colsEl = document.getElementById("cols");
let current = "__overview__";
let sortAlpha = false;

/* ---------- theme, heatmap, layout state ---------- */
const THEMES = [["aurora", "Aurora"], ["light", "Light"], ["classic", "Classic"]];
const PALETTE = {
  aurora:  ["#16204f", "#3b2f8f", "#7b2ea8", "#d5407c", "#ff8a3d", "#ffe45e"],
  light:   ["#eef3ff", "#c3d4ff", "#7fa3ff", "#3f74f0", "#1b3fa8"],
  classic: ["#fff3c4", "#ffd580", "#ff9f43", "#e8590c", "#b02a00"]
};
let theme = "aurora", heat = true, split = false;
try { const t = localStorage.getItem("scAllMetaTheme"); if (THEMES.some(x => x[0] === t)) theme = t; } catch (e) {}
if (theme === "classic") { heat = false; split = true; }

function setTheme(t) {
  theme = t;
  document.documentElement.dataset.theme = t;
  heat = t !== "classic"; split = t === "classic";
  try { localStorage.setItem("scAllMetaTheme", t); } catch (e) {}
  renderTop(); render();
}
function renderTop() {
  document.getElementById("themeseg").innerHTML = THEMES.map(t =>
    '<button data-t="' + t[0] + '" class="' + (theme === t[0] ? "on" : "") + '">' + t[1] + '</button>').join("");
  document.getElementById("crumb").textContent = current === "__overview__" ? "Overview" : current;
}
document.getElementById("themeseg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (b) setTheme(b.dataset.t);
});
document.documentElement.dataset.theme = theme;

const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function ramp(t) {
  const st = PALETTE[theme], x = Math.max(0, Math.min(1, t)) * (st.length - 1), i = Math.min(Math.floor(x), st.length - 2), f = x - i;
  const a = hex(st[i]), b = hex(st[i + 1]), c = a.map((v, k) => Math.round(v + (b[k] - v) * f));
  const lum = (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;
  return {bg: "rgb(" + c.join(",") + ")", fg: lum > 0.55 ? "#0b0f1f" : "#ffffff"};
}
const rampCss = () => "linear-gradient(90deg," + PALETTE[theme].join(",") + ")";

document.getElementById("sub").textContent =
  fmt(DATA.n_cells) + " cells · " + fmt(DATA.columns.length) + " columns";

function tag(c) { return c.type === "numeric" ? '<span class="tag num">num</span>' : '<span class="tag">cat</span>'; }

function renderSidebar() {
  const term = document.getElementById("q").value.trim().toLowerCase();
  let h = '<button class="col ' + (current === "__overview__" ? "active" : "") + '" data-c="__overview__"><span class="nm"><b>Overview</b></span></button>';
  for (const c of DATA.columns) {
    if (term && !c.name.toLowerCase().includes(term)) continue;
    h += '<button class="col ' + (current === c.name ? "active" : "") + '" data-c="' + esc(c.name) + '" title="' + esc(c.name) + '">' +
      '<span class="nm">' + esc(c.name) + '</span>' + tag(c) +
      '<span class="ct">' + fmt(c.n_unique) + '</span></button>';
  }
  colsEl.innerHTML = h;
}
colsEl.addEventListener("click", e => {
  const b = e.target.closest(".col");
  if (b) select(b.dataset.c);
});
document.getElementById("q").addEventListener("input", renderSidebar);

function select(name) { current = name; renderSidebar(); renderTop(); render(); main.scrollTop = 0; }

function tile(k, v) { return '<div class="tile"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>'; }

function renderOverview() {
  const rows = DATA.columns.map(c =>
    '<tr class="link" data-c="' + esc(c.name) + '"><td class="lv">' + esc(c.name) + '</td><td>' + (c.type === "numeric" ? "numeric" : "categorical") +
    '</td><td class="n cn">' + fmt(c.n_unique) + '</td><td class="n cp">' + pfmt(pct(c.n_na, DATA.n_cells)) + '</td></tr>').join("");
  const cat = DATA.columns.filter(c => c.type !== "numeric").length;
  view.innerHTML = '<h2>Overview</h2><div class="lead">Click a column to see its values, counts and percentages.</div>' +
    '<div class="tiles">' + tile("Cells", fmt(DATA.n_cells)) + tile("Columns", fmt(DATA.columns.length)) +
    tile("Categorical", fmt(cat)) + tile("Numeric", fmt(DATA.columns.length - cat)) + '</div>' +
    '<div class="card"><table><thead><tr><th>Column</th><th>Type</th><th class="n">Unique values</th><th class="n">Missing</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  view.querySelectorAll("tr.link").forEach(r => r.onclick = () => select(r.dataset.c));
}

function histSvg(h) {
  const W = 800, H = 220, pad = 24, n = h.counts.length, mx = Math.max(...h.counts, 1);
  const bw = (W - 2 * pad) / n;
  let s = '<svg class="hist" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none"><defs><linearGradient id="hg" x1="0" y1="1" x2="0" y2="0">' +
    '<stop offset="0" style="stop-color:var(--g1)"/><stop offset="0.6" style="stop-color:var(--g2)"/><stop offset="1" style="stop-color:var(--g3)"/></linearGradient></defs>';
  h.counts.forEach((c, i) => {
    const bh = (H - 2 * pad) * c / mx;
    s += '<rect x="' + (pad + i * bw + 1) + '" y="' + (H - pad - bh) + '" width="' + Math.max(bw - 2, 1) + '" height="' + bh +
      '" rx="3" fill="url(#hg)"><title>' + fmt(c) + ' cells</title></rect>';
  });
  return s + '</svg><div class="note">Range ' + h.breaks[0] + ' to ' + h.breaks[1] + ' · ' + n + ' bins</div>';
}

function renderColumn(c) {
  let h = '<h2>' + esc(c.name) + '</h2><div class="lead">' + (c.type === "numeric" ? "Numeric column" : "Categorical column") + '</div><div class="tiles">' +
    tile("Unique values", fmt(c.n_unique)) + tile("Missing (NA)", fmt(c.n_na) + " · " + pfmt(pct(c.n_na, DATA.n_cells)));
  if (c.type === "numeric") {
    const s = c.stats;
    h += tile("Min", s.min) + tile("Median", s.median) + tile("Mean", s.mean) + tile("Max", s.max) + '</div>' +
      '<div class="card"><div class="note">Distribution of values</div>' + histSvg(c.hist) +
      '<table><tbody><tr><td class="lv">Q1 (25%)</td><td class="n cn">' + s.q1 + '</td></tr><tr><td class="lv">Q3 (75%)</td><td class="n cn">' + s.q3 + '</td></tr></tbody></table></div>';
    view.innerHTML = h;
    return;
  }
  h += '</div>' + compareBox(c);
  if (compareWith[c.name]) {
    view.innerHTML = h;
    wireCompare(c);
    renderCross(c, DATA.columns.find(x => x.name === compareWith[c.name]));
    return;
  }
  h += '<div class="card"><div class="tools"><input type="search" id="lq" placeholder="Filter values..." autocomplete="off">' +
    '<button class="btn" id="sortb">Sort: ' + (sortAlpha ? "A-Z" : "count") + '</button><button class="btn" id="csvb">Download CSV</button></div>' +
    '<table><thead><tr><th>Value</th><th class="n">Cells</th><th class="n">%</th><th class="barcell"></th></tr></thead><tbody id="tb"></tbody></table><div id="more"></div></div>';
  view.innerHTML = h;
  wireCompare(c);
  const draw = () => {
    const term = document.getElementById("lq").value.trim().toLowerCase();
    let rows = c.levels.filter(l => !term || String(l.v).toLowerCase().includes(term));
    if (sortAlpha) rows = rows.slice().sort((a, b) => a.na ? 1 : b.na ? -1 : String(a.v).localeCompare(String(b.v), undefined, {numeric: true}));
    const mx = Math.max(...c.levels.map(l => l.n), 1);
    document.getElementById("tb").innerHTML = rows.map(l =>
      '<tr class="' + (l.na ? "na" : "") + '"><td class="lv">' + (l.na ? "NA" : esc(l.v)) + '</td><td class="n cn">' + fmt(l.n) +
      '</td><td class="n cp">' + pfmt(pct(l.n, DATA.n_cells)) + '</td><td class="barcell"><div class="bar" style="width:' + (100 * l.n / mx).toFixed(1) + '%"></div></td></tr>').join("")
      || '<tr><td colspan="4" class="empty">No matching values.</td></tr>';
  };
  draw();
  if (c.hidden_levels > 0) {
    document.getElementById("more").innerHTML = '<div class="note">Showing the top ' + fmt(c.levels.length) + ' values. ' + fmt(c.hidden_levels) +
      ' more values (' + fmt(c.hidden_cells) + ' cells, ' + pfmt(pct(c.hidden_cells, DATA.n_cells)) + ') are not shown. Raise <code>max_levels</code> to see them.</div>';
  }
  document.getElementById("lq").oninput = draw;
  document.getElementById("sortb").onclick = e => { sortAlpha = !sortAlpha; e.target.textContent = "Sort: " + (sortAlpha ? "A-Z" : "count"); draw(); };
  document.getElementById("csvb").onclick = () => {
    const q = v => '"' + String(v).replace(/"/g, '""') + '"';
    const csv = "value,cells,percent\n" + c.levels.map(l => [q(l.na ? "NA" : l.v), l.n, pct(l.n, DATA.n_cells).toFixed(4)].join(",")).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv"}));
    a.download = c.name + "_counts.csv";
    a.click();
  };
}

// ---- compare two columns (contingency table) ----
const compareWith = {};
const decoded = {};
let basis = "col", change = false;

const comparable = () => DATA.columns.filter(c => c.z);

function compareBox(c) {
  if (!c.z) {
    return '<div class="cmp"><span class="hint">' + (DATA.columns.some(x => x.z)
      ? 'This column has too many values to compare.' : 'Comparing was turned off (compare = FALSE).') + '</span></div>';
  }
  const opts = comparable().filter(x => x.name !== c.name).map(x => '<option value="' + esc(x.name) + '">').join("");
  return '<div class="cmp"><b>Compare with</b><input type="search" id="cmpq" list="cmpl" placeholder="Type a column name..." autocomplete="off" value="' +
    esc(compareWith[c.name] || "") + '"><datalist id="cmpl">' + opts + '</datalist>' +
    (compareWith[c.name] ? '<button class="btn" id="cmpx">Clear</button>' : '<span class="hint">Pick a second column to turn this table into a contingency table.</span>') + '</div>';
}

function wireCompare(c) {
  const q = document.getElementById("cmpq");
  if (!q) return;
  q.onchange = () => {
    const hit = comparable().find(x => x.name === q.value.trim() && x.name !== c.name);
    if (hit) { compareWith[c.name] = hit.name; renderColumn(c); }
  };
  const x = document.getElementById("cmpx");
  if (x) x.onclick = () => { delete compareWith[c.name]; renderColumn(c); };
}

async function codesOf(c) {
  if (decoded[c.name]) return decoded[c.name];
  const bin = atob(c.z), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  const ds = new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate")));
  return decoded[c.name] = new Uint8Array(await ds.arrayBuffer());
}

async function renderCross(a, b) {
  const host = document.createElement("div");
  host.innerHTML = '<div class="card"><div class="empty">Counting cells...</div></div>';
  view.appendChild(host);
  const [ca, cb] = await Promise.all([codesOf(a), codesOf(b)]);
  if (compareWith[a.name] !== b.name || current !== a.name) return;
  const ka = a.all_levels.length + 1, kb = b.all_levels.length + 1;
  const cnt = new Float64Array(ka * kb);
  for (let i = 0; i < ca.length; i++) cnt[ca[i] * kb + cb[i]]++;
  const rowT = new Float64Array(ka), colT = new Float64Array(kb);
  for (let r = 0; r < ka; r++) for (let k = 0; k < kb; k++) { rowT[r] += cnt[r * kb + k]; colT[k] += cnt[r * kb + k]; }
  const grand = ca.length;
  const rn = r => r === 0 ? "NA" : a.all_levels[r - 1], cn = k => k === 0 ? "NA" : b.all_levels[k - 1];
  const rows = [], cols = [];
  for (let r = 1; r < ka; r++) if (rowT[r] > 0) rows.push(r);
  if (rowT[0] > 0) rows.push(0);
  for (let k = 1; k < kb; k++) if (colT[k] > 0) cols.push(k);
  if (colT[0] > 0) cols.push(0);
  const natural = f => (x, y) => (x === 0) - (y === 0) || String(f(x)).localeCompare(String(f(y)), undefined, {numeric: true});
  rows.sort(natural(rn)); cols.sort(natural(cn));

  // Change (%) versus the first column, after scaling every column to the
  // first column's total (sample-size adjusted): (n * T1 / Tj - n1) * 100 / n1
  const base = cols[0], others = cols.slice(1);
  const chg = (r, k) => {
    const n1 = cnt[r * kb + base];
    return n1 > 0 ? ((cnt[r * kb + k] * colT[base] / colT[k]) - n1) * 100 / n1 : null;
  };
  const chgFmt = v => v === null ? "-" : (v > 0 ? "+" : "") + v.toFixed(1) + "%";
  const showChange = change && others.length > 0;
  if (showChange) {
    const key = r => { const v = chg(r, others[0]); return v === null ? -Infinity : v; };
    const nas = rows.filter(r => r === 0), rest = rows.filter(r => r !== 0);
    rest.sort((x, y) => key(y) - key(x));
    rows.length = 0; rows.push(...rest, ...nas);
  }

  // denominator for the percentage of one cell
  const dn = (r, k) => basis === "col" ? colT[k] : basis === "row" ? rowT[r] : grand;
  let top = 0, low = Infinity;
  for (const r of rows) for (const k of cols) {
    const n = cnt[r * kb + k];
    const v = basis === "none" ? n : n / (dn(r, k) || 1);
    if (v > top) top = v;
    if (v < low) low = v;
  }
  const level = (r, k) => {
    const n = cnt[r * kb + k];
    const v = basis === "none" ? n : n / (dn(r, k) || 1);
    return top > low ? (v - low) / (top - low) : 0.5;
  };
  const showV = v => basis === "none" ? fmt(v) + " cells" : pfmt(100 * v);

  const cellHtml = (n, d, style, extra) => {
    const p = basis === "none" ? "" : pfmt(pct(n, d));
    if (split && basis !== "none")
      return '<td class="c ' + (extra || "") + ' flat" ' + (style || "") + '>' + fmt(n) + '</td><td class="c pc ' + (extra || "") + '">' + p + '</td>';
    return '<td class="c ' + (extra || "") + ' flat" ' + (style || "") + '>' + fmt(n) + (p ? '<small>' + p + '</small>' : "") + '</td>';
  };
  const head = (label, extra) => split && basis !== "none"
    ? '<th class="' + (extra || "") + '">' + label + '</th><th>%</th>'
    : '<th class="' + (extra || "") + '">' + label + '</th>';

  const seg = [["col", "% of column"], ["row", "% of row"], ["all", "% of all"], ["none", "Counts only"]];
  let t = '<div class="card"><div class="tools"><span class="seg" id="seg">' +
    seg.map(p => '<button data-b="' + p[0] + '" class="' + (basis === p[0] ? "on" : "") + '">' + p[1] + '</button>').join("") + '</span>' +
    '<button class="btn ' + (heat ? "on" : "") + '" id="heatb">Heatmap</button>' +
    '<button class="btn ' + (split ? "on" : "") + '" id="splitb">% in separate columns</button>' +
    '<button class="btn ' + (change ? "on" : "") + '" id="chgb" title="Each column is scaled to the first column\'s total, then compared with the first column">Change % vs first column</button>' +
    '<button class="btn" id="csvx">Download CSV</button></div>';
  if (heat) t += '<div class="legend"><span>' + showV(low) + '</span><span class="ramp" style="background:' + rampCss() + '"></span><span>' + showV(top) + '</span></div>';
  t += '<div class="note">Rows: <b>' + esc(a.name) + '</b> (' + rows.length + ') · Columns: <b>' + esc(b.name) + '</b> (' + cols.length + ')</div>' +
    '<div class="xwrap"><table class="x"><thead><tr><th>' + esc(a.name) + '</th>' +
    cols.map(k => head(esc(cn(k)))).join("") + head("TOTAL", "tc") +
    (showChange ? others.map(k => '<th>Change (%) ' + esc(cn(k)) + '</th>').join("") : "") + '</tr></thead><tbody>';
  for (const r of rows) {
    t += '<tr class="' + (r === 0 ? "na" : "") + '"><td class="lv">' + esc(rn(r)) + '</td>';
    for (const k of cols) {
      const n = cnt[r * kb + k];
      let style = "";
      if (heat) { const hc = ramp(level(r, k)); style = 'style="background:' + hc.bg + ';color:' + hc.fg + '"'; }
      t += cellHtml(n, dn(r, k), style);
    }
    t += cellHtml(rowT[r], basis === "row" ? rowT[r] : grand, "", "tc");
    if (showChange) t += others.map(k => '<td class="c flat">' + chgFmt(chg(r, k)) + '</td>').join("");
    t += '</tr>';
  }
  t += '<tr class="tot"><td>TOTAL</td>' + cols.map(k => cellHtml(colT[k], basis === "col" ? colT[k] : grand)).join("") +
    cellHtml(grand, grand, "", "tc") + (showChange ? others.map(() => '<td class="c flat">-</td>').join("") : "") +
    '</tr></tbody></table></div></div>';
  host.innerHTML = t;
  host.querySelectorAll("#seg button").forEach(btn => btn.onclick = () => { basis = btn.dataset.b; renderColumn(a); });
  host.querySelector("#heatb").onclick = () => { heat = !heat; renderColumn(a); };
  host.querySelector("#splitb").onclick = () => { split = !split; renderColumn(a); };
  host.querySelector("#chgb").onclick = () => { change = !change; renderColumn(a); };
  host.querySelector("#csvx").onclick = () => {
    const q = v => '"' + String(v).replace(/"/g, '""') + '"';
    const lines = [[q(a.name + " \\ " + b.name)].concat(cols.map(k => q(cn(k))), ["TOTAL"]).join(",")];
    for (const r of rows) lines.push([q(rn(r))].concat(cols.map(k => cnt[r * kb + k]), [rowT[r]]).join(","));
    lines.push(["TOTAL"].concat(cols.map(k => colT[k]), [grand]).join(","));
    const el = document.createElement("a");
    el.href = URL.createObjectURL(new Blob([lines.join("\n")], {type: "text/csv"}));
    el.download = a.name + "_vs_" + b.name + ".csv";
    el.click();
  };
}

function render() {
  if (current === "__overview__") return renderOverview();
  renderColumn(DATA.columns.find(c => c.name === current));
}
renderSidebar();
renderTop();
render();
</script>
</body>
</html>
