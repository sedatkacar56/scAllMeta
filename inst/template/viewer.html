<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  --bg:#f6f7f9; --panel:#ffffff; --text:#1c2330; --muted:#697386; --line:#e3e7ee;
  --accent:#2f6fed; --accent-soft:#e8effd; --bar:#7aa2f7; --na:#b9c0cc; --warn:#c9780a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#10141b; --panel:#171d27; --text:#e6eaf2; --muted:#8c97ab; --line:#262e3b;
    --accent:#6c9bff; --accent-soft:#1d2a44; --bar:#4d79d6; --na:#4a5363; --warn:#e0a043;
  }
}
* { box-sizing:border-box; }
body { margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
.app { display:grid; grid-template-columns:300px 1fr; height:100vh; }
aside { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
aside header { padding:16px 16px 10px; }
aside h1 { font-size:16px; margin:0 0 2px; overflow-wrap:anywhere; }
aside .sub { color:var(--muted); font-size:12px; }
input[type=search] { width:100%; margin-top:10px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
input[type=search]:focus { outline:2px solid var(--accent); outline-offset:-1px; }
#cols { overflow:auto; flex:1; padding:6px 8px 16px; }
.col { display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:7px 10px; border:0; border-radius:8px; background:none; color:inherit; font:inherit; cursor:pointer; }
.col:hover { background:var(--accent-soft); }
.col.active { background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent); }
.col .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.col .ct { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
.tag { font-size:10px; text-transform:uppercase; letter-spacing:.04em; padding:1px 6px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
.tag.num { color:var(--warn); border-color:var(--warn); }
main { overflow:auto; padding:28px 32px 48px; }
h2 { margin:0 0 4px; font-size:22px; overflow-wrap:anywhere; }
.lead { color:var(--muted); margin-bottom:20px; }
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:22px; }
.tile { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
.tile .k { color:var(--muted); font-size:12px; }
.tile .v { font-size:20px; font-weight:600; font-variant-numeric:tabular-nums; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:6px 0 10px; }
.tools { display:flex; gap:8px; align-items:center; padding:10px 14px; flex-wrap:wrap; }
.tools input[type=search] { margin:0; max-width:280px; }
button.btn { padding:7px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; cursor:pointer; }
button.btn:hover { border-color:var(--accent); }
table { width:100%; border-collapse:collapse; }
th, td { padding:7px 14px; text-align:left; border-top:1px solid var(--line); }
th { color:var(--muted); font-weight:500; font-size:12px; }
td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
td.lv { max-width:420px; overflow-wrap:anywhere; }
tr.na td.lv { color:var(--muted); font-style:italic; }
.barcell { width:34%; min-width:120px; }
.bar { height:10px; border-radius:5px; background:var(--bar); }
tr.na .bar { background:var(--na); }
tbody tr.link { cursor:pointer; }
tbody tr.link:hover { background:var(--accent-soft); }
.note { color:var(--muted); font-size:12.5px; padding:10px 14px 0; }
svg.hist { width:100%; height:200px; display:block; }
.empty { padding:24px; color:var(--muted); }
@media (max-width:760px) { .app { grid-template-columns:1fr; height:auto; } aside { max-height:40vh; } main { padding:20px 16px; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1>__TITLE__</h1>
      <div class="sub" id="sub"></div>
      <input type="search" id="q" placeholder="Search columns..." autocomplete="off">
    </header>
    <div id="cols"></div>
  </aside>
  <main id="main"></main>
</div>
<script>
const DATA = __DATA__;
const fmt = n => n == null ? "-" : Number(n).toLocaleString();
const pct = (n, tot) => tot ? (100 * n / tot) : 0;
const pfmt = p => p >= 10 ? p.toFixed(1) + "%" : p >= 0.01 ? p.toFixed(2) + "%" : p > 0 ? "<0.01%" : "0%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const main = document.getElementById("main");
const colsEl = document.getElementById("cols");
let current = "__overview__";
let sortAlpha = false;

document.getElementById("sub").textContent =
  fmt(DATA.n_cells) + " cells · " + fmt(DATA.columns.length) + " columns";

function tag(c) { return c.type === "numeric" ? '<span class="tag num">num</span>' : '<span class="tag">cat</span>'; }

function renderSidebar() {
  const term = document.getElementById("q").value.trim().toLowerCase();
  let h = '<button class="col ' + (current === "__overview__" ? "active" : "") + '" data-c="__overview__"><span class="nm"><b>Overview</b></span></button>';
  for (const c of DATA.columns) {
    if (term && !c.name.toLowerCase().includes(term)) continue;
    h += '<button class="col ' + (current === c.name ? "active" : "") + '" data-c="' + esc(c.name) + '" title="' + esc(c.name) + '">' +
      '<span class="nm">' + esc(c.name) + '</span>' + tag(c) +
      '<span class="ct">' + fmt(c.n_unique) + '</span></button>';
  }
  colsEl.innerHTML = h;
}
colsEl.addEventListener("click", e => {
  const b = e.target.closest(".col");
  if (b) select(b.dataset.c);
});
document.getElementById("q").addEventListener("input", renderSidebar);

function select(name) { current = name; renderSidebar(); render(); main.scrollTop = 0; }

function tile(k, v) { return '<div class="tile"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>'; }

function renderOverview() {
  const rows = DATA.columns.map(c =>
    '<tr class="link" data-c="' + esc(c.name) + '"><td class="lv">' + esc(c.name) + '</td><td>' + (c.type === "numeric" ? "numeric" : "categorical") +
    '</td><td class="n">' + fmt(c.n_unique) + '</td><td class="n">' + pfmt(pct(c.n_na, DATA.n_cells)) + '</td></tr>').join("");
  const cat = DATA.columns.filter(c => c.type !== "numeric").length;
  main.innerHTML = '<h2>Overview</h2><div class="lead">Click a column to see its values, counts and percentages.</div>' +
    '<div class="tiles">' + tile("Cells", fmt(DATA.n_cells)) + tile("Columns", fmt(DATA.columns.length)) +
    tile("Categorical", fmt(cat)) + tile("Numeric", fmt(DATA.columns.length - cat)) + '</div>' +
    '<div class="card"><table><thead><tr><th>Column</th><th>Type</th><th class="n">Unique values</th><th class="n">Missing</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  main.querySelectorAll("tr.link").forEach(r => r.onclick = () => select(r.dataset.c));
}

function histSvg(h) {
  const W = 800, H = 200, pad = 24, n = h.counts.length, mx = Math.max(...h.counts, 1);
  const bw = (W - 2 * pad) / n;
  let s = '<svg class="hist" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">';
  h.counts.forEach((c, i) => {
    const bh = (H - 2 * pad) * c / mx;
    s += '<rect x="' + (pad + i * bw + 1) + '" y="' + (H - pad - bh) + '" width="' + Math.max(bw - 2, 1) + '" height="' + bh +
      '" rx="2" fill="var(--bar)"><title>' + fmt(c) + ' cells</title></rect>';
  });
  return s + '</svg><div class="note">Range ' + h.breaks[0] + ' to ' + h.breaks[1] + ' · ' + n + ' bins</div>';
}

function renderColumn(c) {
  let h = '<h2>' + esc(c.name) + '</h2><div class="lead">' + (c.type === "numeric" ? "Numeric column" : "Categorical column") + '</div><div class="tiles">' +
    tile("Unique values", fmt(c.n_unique)) + tile("Missing (NA)", fmt(c.n_na) + " · " + pfmt(pct(c.n_na, DATA.n_cells)));
  if (c.type === "numeric") {
    const s = c.stats;
    h += tile("Min", s.min) + tile("Median", s.median) + tile("Mean", s.mean) + tile("Max", s.max) + '</div>' +
      '<div class="card"><div class="note">Distribution of values</div>' + histSvg(c.hist) +
      '<table><tbody><tr><td>Q1 (25%)</td><td class="n">' + s.q1 + '</td></tr><tr><td>Q3 (75%)</td><td class="n">' + s.q3 + '</td></tr></tbody></table></div>';
    main.innerHTML = h;
    return;
  }
  h += '</div><div class="card"><div class="tools"><input type="search" id="lq" placeholder="Filter values..." autocomplete="off">' +
    '<button class="btn" id="sortb">Sort: ' + (sortAlpha ? "A-Z" : "count") + '</button><button class="btn" id="csvb">Download CSV</button></div>' +
    '<table><thead><tr><th>Value</th><th class="n">Cells</th><th class="n">%</th><th class="barcell"></th></tr></thead><tbody id="tb"></tbody></table><div id="more"></div></div>';
  main.innerHTML = h;
  const draw = () => {
    const term = document.getElementById("lq").value.trim().toLowerCase();
    let rows = c.levels.filter(l => !term || String(l.v).toLowerCase().includes(term));
    if (sortAlpha) rows = rows.slice().sort((a, b) => a.na ? 1 : b.na ? -1 : String(a.v).localeCompare(String(b.v), undefined, {numeric: true}));
    const mx = Math.max(...c.levels.map(l => l.n), 1);
    document.getElementById("tb").innerHTML = rows.map(l =>
      '<tr class="' + (l.na ? "na" : "") + '"><td class="lv">' + (l.na ? "NA" : esc(l.v)) + '</td><td class="n">' + fmt(l.n) +
      '</td><td class="n">' + pfmt(pct(l.n, DATA.n_cells)) + '</td><td class="barcell"><div class="bar" style="width:' + (100 * l.n / mx).toFixed(1) + '%"></div></td></tr>').join("")
      || '<tr><td colspan="4" class="empty">No matching values.</td></tr>';
  };
  draw();
  if (c.hidden_levels > 0) {
    document.getElementById("more").innerHTML = '<div class="note">Showing the top ' + fmt(c.levels.length) + ' values. ' + fmt(c.hidden_levels) +
      ' more values (' + fmt(c.hidden_cells) + ' cells, ' + pfmt(pct(c.hidden_cells, DATA.n_cells)) + ') are not shown. Raise <code>max_levels</code> to see them.</div>';
  }
  document.getElementById("lq").oninput = draw;
  document.getElementById("sortb").onclick = e => { sortAlpha = !sortAlpha; e.target.textContent = "Sort: " + (sortAlpha ? "A-Z" : "count"); draw(); };
  document.getElementById("csvb").onclick = () => {
    const q = v => '"' + String(v).replace(/"/g, '""') + '"';
    const csv = "value,cells,percent\n" + c.levels.map(l => [q(l.na ? "NA" : l.v), l.n, pct(l.n, DATA.n_cells).toFixed(4)].join(",")).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv"}));
    a.download = c.name + "_counts.csv";
    a.click();
  };
}

function render() {
  if (current === "__overview__") return renderOverview();
  renderColumn(DATA.columns.find(c => c.name === current));
}
renderSidebar();
render();
</script>
</body>
</html>
